name: Telegram Bot Run

on:
  push:
    branches: [main]
  # Позволяет запускать бота вручную кнопкой в интерфейсе GitHub
  workflow_dispatch:
  # Перезапуск каждые 5 часов: GitHub ограничивает job 6 часами
  schedule:
    - cron: '0 */5 * * *'

permissions:
  contents: read

# Не даём двум экземплярам бота работать одновременно:
# иначе polling получит 409 Conflict от Telegram
concurrency:
  group: telegram-bot
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    # Меньше 6-часового лимита GitHub, чтобы завершиться до следующего запуска
    timeout-minutes: 350

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Bot
        # WEBHOOK_BASE_URL намеренно не задаём: в GitHub Actions нет публичного
        # HTTPS-адреса, поэтому бот работает в режиме long polling.
        env:
          PYTHONUNBUFFERED: "1"
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          BOT_ADMINS: ${{ secrets.BOT_ADMINS }}
          POSTGRES_NAME: ${{ secrets.POSTGRES_NAME }}
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: python bot.py
